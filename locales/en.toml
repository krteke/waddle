[config_help]
"allow_insecure" = "Allow insecure TLS certificates. It is not recommended to turn it on unless you have to."
"auto_config_kernel_parameter" = "Automatically configure Linux kernel parameters like ip_forward and send_redirects."
"bootstrap_resolver" = "DNS resolver for bootstrap lookups before dae DNS routing is available. Leave empty to use 119.29.29.29:53 and 223.5.5.5:53 in order. An explicit resolver replaces both defaults."
"check_tolerance" = "Group will switch node only when new_latency <= old_latency - tolerance. Include a unit, for example 500ms."
"disable_waiting_network" = "Disable waiting for network before pulling subscriptions."
"fallback_resolver" = "Specify a fallback DNS resolver to be used when DNS resolution using resolv.conf fails. This ensures DNS resolution continues to work even when the system's default DNS servers are unavailable or not responding properly. Leave empty to use 8.8.8.8:53."
"lan_interface" = "The LAN interface to bind. Use it if you want to proxy LAN."
"sniffing_timeout" = "This parameter sets the wait time for the first data transmission during sniffing. It is always 0 if dial mode set to 'ip'. Increasing this value can be helpful in high-latency LAN environments. Include a unit, for example 30ms."
"so_mark_from_dae" = "Socket mark for dae-originated traffic (SO_MARK). Set a non-zero value to override the internal mark. Explicit 0 keeps the internal protection against UDP self-capture."
"tcp_check_http_method" = "HTTP request method for TCP connectivity checks. HEAD is the default because some servers do not account for its traffic."
"tcp_check_url" = "Both IPv4 and IPv6 are required for the host of URL if your local network supports both. First is URL, others are IP addresses if given. Considering traffic consumption, it is recommended to choose a site with anycast IP and less traffic."
"tproxy_port" = "Transparent Proxy Port to listen on. Valid range is 0 - 65535. It is NOT a HTTP/SOCKS port, and is just used by eBPF program. In normal case, you do not need to use it."
"tproxy_port_protect" = "Set it true to protect tproxy port from unsolicited traffic. Set it false to allow users to use self-managed iptables tproxy rules."
"udp_check_dns" = "DNS used to check node UDP connectivity, and TCP DNS connectivity when a TCP upstream is used. The first item is a DNS host:port (for example dns.google:53); subsequent items are optional IP addresses. Include IPv4 and IPv6 for a dual-stack network."
"utls_imitate" = "The Client Hello ID for uTLS to imitate. This takes effect only if tls_implementation is utls."
"wan_interface" = "The WAN interface to bind. Use it if you want to proxy localhost. Use auto to detect the interface automatically."
"pprof_port" = "Port for the pprof performance profiler. Set 0 to disable it."
"mptcp" = "Try Multipath TCP when connecting to nodes. Nodes must support MPTCP; multiple interfaces and IPs can provide load balancing and failover."
"bandwidth_max_tx" = "The maximum bandwidth for accessing the Internet. It is useful for some specific protocols (e.g., Hysteria2). '200 mbps' # uplink, '200 m', '200 mb', '200 mbps' or 25000000 (which is 200/8*1000*1000) Leave empty to use 0."
"bandwidth_max_rx" = "The maximum bandwidth for accessing the Internet. It is useful for some specific protocols (e.g., Hysteria2). '200 mbps' # downlink, '200 m', '200 mb', '200 mbps' or 25000000 (which is 200/8*1000*1000) Leave empty to use 0."
"dial_mode_domain" = "Dial proxy using the domain from sniffing. This will greatly relieve DNS pollution problem in an impure DNS environment. Generally, this mode brings faster proxy response time because proxy will re-resolve the domain remotely, contributing to better IP results. This policy does not impact routing. That is to say, domain rewrite will be routed after traffic split and dae will not re-route it."
"dial_mode_domain+" = "Based on domain mode but do not check the reality of sniffed domain. It is useful for users whose DNS requests do not go through dae but want faster proxy response time. Notice that, if DNS requests do not go through dae, dae cannot split traffic by domain."
"dial_mode_domain++" = "Based on domain+ mode but enforce traffic re-routing using sniffed domain. It can also partially restore the ability to split traffic based on domains. However, it doesn't work for direct traffic and consumes more CPU resources."
"dial_mode_ip" = "Dial proxy using the IP from DNS directly. This allows your IPv4, IPv6 to choose the optimal path respectively, and makes the IP version requested by the application meet expectations. For example, if you use curl -4 ip.sb, you will request IPv4 via proxy and get an IPv4 echo. And curl -6 ip.sb will request IPv6. This may solve some weird full-cone problems if your node supports that. Sniffing will be disabled in this mode."
"name" = ""
"log_level" = "Choose how much detail dae writes to its logs. Debug and trace produce more output."
"check_interval" = "Interval between TCP and UDP connectivity checks. Include a unit, for example 30s."
"udphop_interval" = "Interval between UDP port hops for protocols that support port hopping. Include a unit, for example 30s."
"disable_thp" = "Disable transparent huge pages for the dae process if they cause excessive memory usage. This does not change system-wide THP settings."
"auto_sniff_punt" = "Use sniffing to preserve device-specific domain whitelist rules when client DNS bypasses dae. Requires sniffing and a dial mode other than ip."
"bpf_conn_state_map_size" = "Maximum tracked TCP/UDP flows in the shared eBPF map. Lower values reduce locked kernel memory. Takes effect on a fresh eBPF load or restart."
"auto_config_firewall_rule" = "Retained by the API, but no longer used by the current dae core."
"enable_local_tcp_fast_redirect" = "Retained by the API, but no longer used by the current dae core."
"tls_fragment" = "Split the TLS Client Hello into smaller fragments. Length and interval settings control how it is split."
"tls_fragment_length" = "TLS fragment length range in bytes, for example 50-100."
"tls_implementation_tls" = "Use Go’s crypto/tls for standard TLS connections."
"tls_implementation_utls" = "Use uTLS to imitate a browser’s Client Hello. The fingerprint below selects which client to imitate."
"tls_fragment_interval" = "Delay between TLS fragments in milliseconds, for example 10-20."

