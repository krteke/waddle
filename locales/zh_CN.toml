[config_help]
"allow_insecure" = "允许使用不安全的TLS证书。除非迫不得已，否则不建议打开它。"
"auto_config_kernel_parameter" = "自动配置 Linux 内核参数，如 ip_forward（路由转发）和 send_redirects（发送重定向）。"
"bootstrap_resolver" = "在 dae DNS 路由可用前进行引导查询的 DNS 解析器。留空时依次使用 119.29.29.29:53 和 223.5.5.5:53；显式填写后仅使用指定解析器。"
"check_tolerance" = "只有当新的延迟 <= 旧的延迟 - 公差时，群组才会切换节点。 请包含单位，例如 500ms。"
"disable_waiting_network" = "禁用在拉取订阅之前等待网络。"
"fallback_resolver" = "指定一个备用 DNS 解析器，当系统 resolv.conf 中的 DNS 服务器无法正常工作时使用。这确保了即使系统默认 DNS 服务器不可用或响应异常时，DNS 解析功能仍能正常工作。 留空时使用 8.8.8.8:53。"
"lan_interface" = "要绑定的 LAN 接口。如果您想代理局域网，请使用它。"
"sniffing_timeout" = "等待第一次发送数据以进行嗅探时超时。如果拨号模式为 ip，则始终为 0。将其设置得更高在高延迟局域网网络中很有用。 请包含单位，例如 30ms。"
"so_mark_from_dae" = "为 dae 发出的流量设置套接字标记（SO_MARK）。非零值覆盖内部标记；显式设为 0 则保留防止 UDP 自捕获的内部保护标记。"
"tcp_check_http_method" = "对 TCP 检测链接的 HTTP 请求方法。默认情况下使用 HEAD，因为某些服务器实现绕过了对此类流量的核算。"
"tcp_check_url" = "如果您在本地有 dual stack（双协议栈），URL 的域名解析应该同时具有 IPv4 和 IPv6。第一个是 URL，其他是 IP 地址（如果给定的话）。考虑到流量消耗，建议选择具有 anycast IP 且响应较少的站点。"
"tproxy_port" = "要监听的透明代理端口。合法范围是 0 - 65535。它不是 HTTP/SOCKS 端口，仅由 eBPF 程序使用。在正常情况下，您不需要使用它。"
"tproxy_port_protect" = "将其设置为 true 可保护透明代理端口免受未经请求的流量的影响。将其设置为 false 以允许用户使用自我管理的 iptables 透明代理规则。"
"udp_check_dns" = "用于检查节点的 UDP 连通性；使用 TCP DNS 上游时，也用于检查 TCP DNS 连通性。第一项是 DNS 主机和端口（例如 dns.google:53），其余为可选的 IP 地址。双协议栈网络应同时提供 IPv4 和 IPv6。"
"utls_imitate" = "要模仿的 uTLS 的客户端 Hello ID。只有当 TLS 实现 为 utls 时，此操作才会生效。"
"wan_interface" = "要绑定的 WAN 接口。如果您想代理本机，请使用它。 填写 auto 可自动检测接口。"
"pprof_port" = "pprof 性能分析服务使用的端口。设为 0 表示禁用。"
"mptcp" = "尝试使用多路径 TCP 连接节点。需要节点支持 MPTCP，可利用多个接口和 IP 实现负载均衡与故障转移。"
"bandwidth_max_tx" = "访问互联网的最大上行带宽。它对某些特定协议（如 Hysteria2）很有用、在提供带宽信息的情况下，其性能会更好。单位可以是 b、kb、mb、gb、tb 或字节/秒。'1 gbps' # uplink, or '1 g' or '1 gb' or '1 gbps' or 125000000 (which is 1000/8*1000*1000) 留空时使用 0。"
"bandwidth_max_rx" = "访问互联网的最大下行带宽。它对某些特定协议（如 Hysteria2）很有用、在提供带宽信息的情况下，其性能会更好。单位可以是 b、kb、mb、gb、tb 或字节/秒。'200 mbps' # downlink, or '200 m' or '200 mb' or '200 mbps' or 25000000 (which is 200/8*1000*1000) 留空时使用 0。"
"dial_mode_domain" = "通过嗅探使用域名拨号代理。如果 DNS 环境不纯净，这将在很大程度上缓解 DNS 污染问题。通常，这种模式会带来更快的代理响应时间，因为代理会在远程重新解析域名，从而获得更好的 IP 连接结果。此策略不影响路由。也就是说，域重写将在流量拆分后进行路由，dae 不会对其进行重新路由。"
"dial_mode_domain+" = "基于 domain 模式但不检查嗅探域名的真实性。对于那些 DNS 请求不通过 dae 但想要更快的代理响应时间的用户来说，这很有用。请注意，如果 DNS 请求不通过 dae，dae 就无法按域划分流量。"
"dial_mode_domain++" = "基于 domain+ 模式，但强制使用嗅探域重新路由流量，以部分恢复基于域的流量拆分能力。它不适用于直接流量，并且会消耗更多的 CPU 资源。"
"dial_mode_ip" = "直接使用来自 DNS 的 IP 拨号代理。这允许您的 ipv4、ipv6 分别选择最佳路径，并使应用程序请求的 IP 版本符合预期。例如，如果您使用 curl -4 ip.sb，您将通过代理请求 IPv4 并获得 IPv4 回显。curl -6 ip.sb 将请求 IPv6。如果你是你的节点支持的话，这可能会解决一些怪异的全锥形问题。在此模式下将禁用嗅探。"
"name" = ""
"log_level" = "选择 dae 日志的详细程度。debug 和 trace 会产生更多输出。"
"check_interval" = "TCP 和 UDP 连通性检查的间隔。请包含单位，例如 30s。"
"udphop_interval" = "支持端口跳跃的协议在两次 UDP 端口跳跃之间的间隔。请包含单位，例如 30s。"
"disable_thp" = "当透明大页导致 dae 内存占用过高时，可为 dae 进程禁用透明大页。此选项不会改变系统的 THP 设置。"
"auto_sniff_punt" = "当客户端 DNS 绕过 dae 时，通过嗅探维持针对设备的域名白名单规则。需要启用嗅探，且拨号模式不能为 ip。"
"bpf_conn_state_map_size" = "共享 eBPF 映射最多跟踪的 TCP／UDP 连接数。较小的值能减少锁定的内核内存。重新加载 eBPF 或重启后生效。"
"auto_config_firewall_rule" = "API 保留此字段，但当前 dae 内核已不再使用。"
"enable_local_tcp_fast_redirect" = "API 保留此字段，但当前 dae 内核已不再使用。"
"tls_fragment" = "将 TLS Client Hello 拆分成较小的片段，由片段长度和间隔控制拆分方式。"
"tls_fragment_length" = "TLS 片段长度范围，单位为字节，例如 50-100。"
"tls_implementation_tls" = "使用 Go 的 crypto/tls 建立标准 TLS 连接。"
"tls_implementation_utls" = "使用 uTLS 模仿浏览器的 Client Hello，通过下方指纹选择要模仿的客户端。"
"tls_fragment_interval" = "TLS 片段之间的延迟范围，单位为毫秒，例如 10-20。"

