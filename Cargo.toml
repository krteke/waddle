[package]
name = "waddle"
version = "0.1.0"
edition = "2024"

[dependencies]
graphql_client = "0.16.0"
oo7 = "0.6.0"
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_50"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", features = ["json"] }
url = "2.5.8"
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
qrcode = { version = "0.14.1", default-features = false }
base64 = "0.23.1"
percent-encoding = "2.3.2"

[dev-dependencies]
tokio = "1.54.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
